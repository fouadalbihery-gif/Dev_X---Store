async function dashboard(c){const [p,o,u,pa]=await Promise.all([table('products','id,status,stock,price,name',null),table('orders','id,order_number,total,order_status,created_at'),table('users','id,email,full_name,is_active,created_at'),table('payments','id,order_id,amount,status,created_at')]);c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">لوحة التحكم</h1><p class="dx-sub">بيانات حقيقية من قاعدة البيانات — بدون بيانات تجريبية.</p></div></div><div class="dx-grid"><div class="dx-card dx-stat">المنتجات<b>${p.length}</b></div><div class="dx-card dx-stat">الطلبات<b>${o.length}</b></div><div class="dx-card dx-stat">المستخدمون<b>${u.length}</b></div><div class="dx-card dx-stat">المدفوعات<b>${pa.length}</b></div></div>`}

async function productForm(p={}){const can=await allowed(p.id?'products.update':'products.create');if(!can){toast('لا توجد صلاحية لتنفيذ العملية',false);return}A.el.insertAdjacentHTML('beforeend',`<div id="dx-modal" style="position:fixed;inset:0;background:#0b153099;z-index:2147483600;display:grid;place-items:center;padding:20px"><div class="dx-card" style="width:min(760px,100%);max-height:92vh;overflow:auto"><div class="dx-top"><h2>${p.id?'تعديل المنتج':'إضافة منتج'}</h2><button class="dx-btn light" onclick="document.getElementById('dx-modal').remove()">×</button></div><div class="dx-formgrid"><div class="dx-field"><label>اسم المنتج</label><input id="pf-name" value="${esc(p.name)}"></div><div class="dx-field"><label>SKU</label><input id="pf-sku" value="${esc(p.sku)}"></div><div class="dx-field"><label>السعر</label><input id="pf-price" type="number" value="${p.price??''}"></div><div class="dx-field"><label>السعر السابق</label><input id="pf-old" type="number" value="${p.previous_price??''}"></div><div class="dx-field"><label>المخزون</label><input id="pf-stock" type="number" value="${p.stock??0}"></div><div class="dx-field"><label>الحالة</label><select id="pf-status"><option value="published" ${p.status==='published'?'selected':''}>منشور</option><option value="draft" ${p.status==='draft'?'selected':''}>مسودة</option></select></div></div><div class="dx-field"><label>الوصف</label><textarea id="pf-desc">${esc(p.description)}</textarea></div><div class="dx-field"><label>رابط الصورة الرئيسية</label><input id="pf-img" value="${esc(p.main_image||'')}"></div><div class="dx-actions"><button class="dx-btn" onclick='DXAdmin.saveProduct(${JSON.stringify(p)})'>حفظ</button><button class="dx-btn light" onclick="document.getElementById('dx-modal').remove()">إلغاء</button></div></div></div>`)}
async function saveProduct(old){const payload={name:q('#pf-name').value.trim(),sku:q('#pf-sku').value.trim(),price:Number(q('#pf-price').value),previous_price:q('#pf-old').value===''?null:Number(q('#pf-old').value),stock:Number(q('#pf-stock').value||0),status:q('#pf-status').value,description:q('#pf-desc').value.trim(),main_image:q('#pf-img').value.trim()||null};if(!payload.name||!payload.sku||!Number.isFinite(payload.price)){toast('أكمل بيانات المنتج',false);return}let r=old.id?await client.from('products').update(payload).eq('id',old.id):await client.from('products').insert(payload);if(r.error){toast(r.error.message,false);return}document.getElementById('dx-modal').remove();toast('تم حفظ المنتج');renderTab()}
async function delProduct(id){if(!(await allowed('products.delete')))return toast('لا توجد صلاحية للحذف',false);if(!confirm('حذف المنتج نهائيًا؟'))return;const r=await client.from('products').delete().eq('id',id);if(r.error)return toast(r.error.message,false);toast('تم الحذف');renderTab()}
async function categories(c){const rows=await table('categories','*');c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">التصنيفات</h1></div><button class="dx-btn" onclick="DXAdmin.catForm()">+ إضافة تصنيف</button></div><div class="dx-card"><div class="dx-table-wrap"><table class="dx-table"><thead><tr><th>الاسم</th><th>Slug</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.slug)}</td><td>${x.is_active===false?'غير نشط':'نشط'}</td><td><button class="dx-btn light" onclick='DXAdmin.catForm(${JSON.stringify(x)})'>تعديل</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد تصنيفات.</td></tr>'}</tbody></table></div></div>`}
async function catForm(x={}){A.el.insertAdjacentHTML('beforeend',`<div id="dx-modal" style="position:fixed;inset:0;background:#0b153099;z-index:2147483600;display:grid;place-items:center;padding:20px"><div class="dx-card" style="width:min(500px,100%)"><h2>${x.id?'تعديل التصنيف':'إضافة تصنيف'}</h2><div class="dx-field"><label>الاسم</label><input id="cf-name" value="${esc(x.name)}"></div><div class="dx-field"><label>Slug</label><input id="cf-slug" value="${esc(x.slug)}"></div><div class="dx-actions"><button class="dx-btn" onclick='DXAdmin.saveCat(${JSON.stringify(x)})'>حفظ</button><button class="dx-btn light" onclick="document.getElementById('dx-modal').remove()">إلغاء</button></div></div></div>`)}
async function saveCat(x){const p={name:q('#cf-name').value.trim(),slug:q('#cf-slug').value.trim()};const r=x.id?await client.from('categories').update(p).eq('id',x.id):await client.from('categories').insert(p);if(r.error)return toast(r.error.message,false);document.getElementById('dx-modal').remove();toast('تم الحفظ');renderTab()}
async function inventory(c){const rows=await table('products','id,name,sku,stock,price',null);c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">المخزون</h1><p class="dx-sub">تعديل الكميات الحالية مباشرة.</p></div></div><div class="dx-card"><table class="dx-table"><thead><tr><th>المنتج</th><th>SKU</th><th>المخزون</th><th>السعر</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><input id="stk-${p.id}" type="number" value="${p.stock??0}" style="width:100px;padding:7px;border:1px solid #ddd;border-radius:7px"></td><td>${money(p.price)}</td><td><button class="dx-btn light" onclick="DXAdmin.stock('${p.id}')">حفظ</button></td></tr>`).join('')||'<tr><td colspan="5">لا يوجد مخزون.</td></tr>'}</tbody></table></div>`}
async function stock(id){const r=await client.from('products').update({stock:Number(q('#stk-'+id).value||0)}).eq('id',id);if(r.error)return toast(r.error.message,false);toast('تم تحديث المخزون')}
async function orders(c){const rows=await table('admin_orders','*');c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">الطلبات</h1><p class="dx-sub">الطلبات الحقيقية المسجلة في Supabase.</p></div></div><div class="dx-card"><table class="dx-table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name||o.email||'')}</td><td>${money(o.total)}</td><td><select onchange="DXAdmin.orderStatus('${o.id}',this.value)"><option ${o.order_status==='pending'?'selected':''}>pending</option><option ${o.order_status==='processing'?'selected':''}>processing</option><option ${o.order_status==='shipped'?'selected':''}>shipped</option><option ${o.order_status==='delivered'?'selected':''}>delivered</option><option ${o.order_status==='cancelled'?'selected':''}>cancelled</option></select></td><td>${new Date(o.created_at).toLocaleString('ar-EG')}</td><td><button class="dx-btn light" onclick="DXAdmin.orderDetails('${o.id}')">التفاصيل</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد طلبات.</td></tr>'}</tbody></table></div>`}
async function orderStatus(id,status){const r=await client.rpc('admin_update_order_status',{p_order_id:id,p_order_status:status});if(r.error)toast(r.error.message,false);else toast('تم تحديث حالة الطلب')}
async function orderDetails(id){const r=await client.rpc('admin_get_order_details',{p_order_id:id});if(r.error)return toast(r.error.message,false);A.el.insertAdjacentHTML('beforeend',`<div id="dx-modal" style="position:fixed;inset:0;background:#0b153099;z-index:2147483600;display:grid;place-items:center;padding:20px"><div class="dx-card" style="width:min(800px,100%);max-height:90vh;overflow:auto"><h2>تفاصيل الطلب</h2><pre style="white-space:pre-wrap;direction:ltr;background:#f8fafc;padding:12px;border-radius:8px">${esc(JSON.stringify(r.data,null,2))}</pre><button class="dx-btn" onclick="document.getElementById('dx-modal').remove()">إغلاق</button></div></div>`)}
async function payments(c){const rows=await table('payments','*');c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">المدفوعات</h1></div></div><div class="dx-card"><table class="dx-table"><thead><tr><th>Order ID</th><th>المبلغ</th><th>الحالة</th><th>الطريقة</th><th>التاريخ</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.order_id)}</td><td>${money(p.amount)}</td><td><select onchange="DXAdmin.payStatus('${p.order_id}',this.value)"><option value="pending" ${p.status==='pending'?'selected':''}>pending</option><option value="paid" ${p.status==='paid'?'selected':''}>paid</option><option value="failed" ${p.status==='failed'?'selected':''}>failed</option><option value="refunded" ${p.status==='refunded'?'selected':''}>refunded</option></select></td><td>${esc(p.payment_method||'')}</td><td>${new Date(p.created_at).toLocaleString('ar-EG')}</td><td></td></tr>`).join('')||'<tr><td colspan="6">لا توجد مدفوعات.</td></tr>'}</tbody></table></div>`}
async function payStatus(id,status){const r=await client.rpc('admin_update_payment_status',{p_order_id:id,p_payment_status:status});if(r.error)toast(r.error.message,false);else toast('تم تحديث الدفع')}
async function customers(c){const rows=await table('users','*');c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">العملاء والمستخدمون</h1><p class="dx-sub">عرض وتعديل بيانات المستخدمين المسجلة في public.users.</p></div></div><div class="dx-card"><table class="dx-table"><thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الحالة</th><th>الدور القديم</th><th></th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.full_name||u.name||'')}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'')}</td><td><select onchange="DXAdmin.userActive('${u.id}',this.value)"><option value="true" ${u.is_active!==false?'selected':''}>نشط</option><option value="false" ${u.is_active===false?'selected':''}>موقوف</option></select></td><td>${esc(u.role||'')}</td><td><button class="dx-btn light" onclick='DXAdmin.userForm(${JSON.stringify(u)})'>تعديل</button></td></tr>`).join('')||'<tr><td colspan="6">لا يوجد مستخدمون.</td></tr>'}</tbody></table></div>`}
async function userActive(id,v){const r=await client.from('users').update({is_active:v==='true'}).eq('id',id);if(r.error)toast(r.error.message,false);else toast('تم التحديث')}
async function userForm(u){A.el.insertAdjacentHTML('beforeend',`<div id="dx-modal" style="position:fixed;inset:0;background:#0b153099;z-index:2147483600;display:grid;place-items:center;padding:20px"><div class="dx-card" style="width:min(520px,100%)"><h2>تعديل المستخدم</h2><div class="dx-field"><label>الاسم</label><input id="uf-name" value="${esc(u.full_name||u.name)}"></div><div class="dx-field"><label>الهاتف</label><input id="uf-phone" value="${esc(u.phone)}"></div><div class="dx-actions"><button class="dx-btn" onclick="DXAdmin.saveUser('${u.id}')">حفظ</button><button class="dx-btn light" onclick="document.getElementById('dx-modal').remove()">إلغاء</button></div></div></div>`)}
async function saveUser(id){const r=await client.from('users').update({full_name:q('#uf-name').value.trim(),phone:q('#uf-phone').value.trim()}).eq('id',id);if(r.error)return toast(r.error.message,false);document.getElementById('dx-modal').remove();toast('تم حفظ بيانات المستخدم');renderTab()}
async function roles(c){const [rs,ps,urs,rps,us]=await Promise.all([table('roles','*'),table('permissions','*','key'),table('user_roles','*',null),table('role_permissions','*',null),table('users','id,email,full_name','created_at')]);c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">الأدوار والصلاحيات</h1><p class="dx-sub">إدارة كاملة لـ RBAC: رؤية وتعديل وتعيين وسحب الصلاحيات من قاعدة البيانات.</p></div></div><div class="dx-card"><h3>تعيين صلاحيات لدور</h3><div class="dx-formgrid"><div class="dx-field"><label>الدور</label><select id="rp-role">${rs.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div><div id="rp-box" class="dx-perm"></div><div class="dx-actions" style="margin-top:12px"><button class="dx-btn" onclick="DXAdmin.saveRolePerms()">حفظ صلاحيات الدور</button></div></div><div class="dx-card" style="margin-top:14px"><h3>تعيين دور لمستخدم</h3><div class="dx-formgrid"><div class="dx-field"><label>المستخدم</label><select id="ur-user">${us.map(u=>`<option value="${u.id}">${esc(u.full_name||u.email)} — ${esc(u.email)}</option>`).join('')}</select></div><div class="dx-field"><label>الدور</label><select id="ur-role">${rs.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div><button class="dx-btn" onclick="DXAdmin.assignRole()">تعيين الدور</button></div><div class="dx-card" style="margin-top:14px"><h3>الأدوار</h3><div class="dx-table-wrap"><table class="dx-table"><thead><tr><th>الدور</th><th>System</th><th>الوصف</th><th>عدد الصلاحيات</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.is_system?'نعم':'لا'}</td><td>${esc(r.description)}</td><td>${rps.filter(x=>x.role_id===r.id).length}</td></tr>`).join('')}</tbody></table></div></div><div class="dx-card" style="margin-top:14px"><h3>تعيينات المستخدمين الحالية</h3><div class="dx-table-wrap"><table class="dx-table"><thead><tr><th>المستخدم</th><th>الدور</th><th></th></tr></thead><tbody>${urs.map(x=>{const u=us.find(z=>z.id===x.user_id),r=rs.find(z=>z.id===x.role_id);return `<tr><td>${esc(u?.full_name||u?.email||x.user_id)}</td><td>${esc(r?.name||x.role_id)}</td><td><button class="dx-btn red" onclick="DXAdmin.revokeRole('${x.user_id}','${x.role_id}')">سحب الدور</button></td></tr>`}).join('')||'<tr><td colspan="3">لا توجد تعيينات.</td></tr>'}</tbody></table></div></div><div class="dx-card" style="margin-top:14px"><h3>كل الصلاحيات</h3><div class="dx-perm">${ps.map(p=>`<div class="dx-check"><code>${esc(p.key)}</code><span class="dx-muted">${esc(p.description)}</span></div>`).join('')}</div></div>`;const sel=q('#rp-role');sel.onchange=()=>DXAdmin.loadRolePerms();await loadRolePerms();}
async function loadRolePerms(){const roleId=q('#rp-role')?.value;if(!roleId)return;const {data}=await client.from('role_permissions').select('permission_id').eq('role_id',roleId);const ids=new Set((data||[]).map(x=>x.permission_id));const {data:ps}=await client.from('permissions').select('id,key,description').order('key');const box=q('#rp-box');if(box)box.innerHTML=(ps||[]).map(p=>`<label class="dx-check"><input type="checkbox" data-perm="${p.id}" ${ids.has(p.id)?'checked':''}> <code>${esc(p.key)}</code><span class="dx-muted">${esc(p.description)}</span></label>`).join('');}
async function saveRolePerms(){const roleId=q('#rp-role')?.value;if(!roleId)return;const can=await allowed('permissions.assign');if(!can)return toast('لا توجد صلاحية لتعديل صلاحيات الأدوار',false);const ids=[...A.el.querySelectorAll('[data-perm]:checked')].map(x=>x.dataset.perm);let r=await client.from('role_permissions').delete().eq('role_id',roleId);if(r.error)return toast(r.error.message,false);if(ids.length){r=await client.from('role_permissions').insert(ids.map(permission_id=>({role_id:roleId,permission_id})));if(r.error)return toast(r.error.message,false)}toast('تم حفظ صلاحيات الدور');await loadRolePerms()}
async function assignRole(){const can=await allowed('user_roles.assign');if(!can)return toast('لا توجد صلاحية لتعيين الأدوار',false);const user_id=q('#ur-user')?.value,role_id=q('#ur-role')?.value;if(!user_id||!role_id)return;const r=await client.from('user_roles').upsert({user_id,role_id},{onConflict:'user_id,role_id'});if(r.error)return toast(r.error.message,false);toast('تم تعيين الدور');renderTab()}
async function revokeRole(user_id,role_id){const can=await allowed('user_roles.revoke');if(!can)return toast('لا توجد صلاحية لسحب الأدوار',false);if(!confirm('سحب الدور من المستخدم؟'))return;const r=await client.from('user_roles').delete().eq('user_id',user_id).eq('role_id',role_id);if(r.error)return toast(r.error.message,false);toast('تم سحب الدور');renderTab()}
async function reports(c){const [o,p,u]=await Promise.all([table('orders','id,total,order_status,created_at'),table('products','id,stock,status,price'),table('users','id,is_active',null)]);const revenue=o.filter(x=>x.order_status!=='cancelled').reduce((s,x)=>s+Number(x.total||0),0);c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">التقارير</h1><p class="dx-sub">مؤشرات محسوبة من البيانات الحالية، بدون أرقام تجريبية.</p></div></div><div class="dx-grid"><div class="dx-card dx-stat">إجمالي الطلبات<b>${o.length}</b></div><div class="dx-card dx-stat">الإيراد المسجل<b>${money(revenue)}</b></div><div class="dx-card dx-stat">منتجات منخفضة المخزون<b>${p.filter(x=>Number(x.stock||0)<=5).length}</b></div><div class="dx-card dx-stat">المستخدمون النشطون<b>${u.filter(x=>x.is_active!==false).length}</b></div></div>`}
async function offers(c){const rows=await table('products','id,name,price,previous_price,badge,status',null);c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">العروض</h1><p class="dx-sub">لا يوجد جدول Offers في المخطط الحالي؛ العروض تعتمد على السعر السابق والبادج داخل المنتجات.</p></div></div><div class="dx-card"><table class="dx-table"><thead><tr><th>المنتج</th><th>السعر</th><th>السعر السابق</th><th>Badge</th><th>الحالة</th></tr></thead><tbody>${rows.filter(x=>x.previous_price!=null||x.badge).map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.price)}</td><td>${money(x.previous_price)}</td><td>${esc(x.badge)}</td><td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد عروض حاليًا.</td></tr>'}</tbody></table></div>`}
async function settings(c){c.innerHTML=`<div class="dx-top"><div><h1 class="dx-title">الإعدادات</h1><p class="dx-sub">الإعدادات الإدارية المعتمدة حاليًا من قاعدة البيانات.</p></div></div><div class="dx-card"><div class="dx-alert">لا يوجد جدول settings في المخطط الحالي المكوّن من 17 جدولًا، لذلك لن يتم اختراع إعدادات أو بيانات غير موجودة.</div><p>الحماية والصلاحيات تعتمد على Supabase Auth + RBAC + RLS.</p><p>حساب Admin والصلاحيات يتم التحكم فيها من جداول roles / permissions / role_permissions / user_roles.</p></div>`}
async function logout(){await client.auth.signOut();A.user=null;A.el.innerHTML='';A.el.remove();location.href='/'}
window.DXAdmin={login,logout,productForm,saveProduct,delProduct,catForm,saveCat,stock,orderStatus,orderDetails,payStatus,userActive,userForm,saveUser,renderTab,loadRolePerms,saveRolePerms,assignRole,revokeRole};
window.__DEVX_ADMIN_READY=true;
if(location.pathname.startsWith('/admin')){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();}
})();
</script></body></html>
